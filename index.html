<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>GCSE Revision</title>
  <meta name="description" content="5-minute GCSE revision tests for English, Maths and Science, with a progress dashboard." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap" rel="stylesheet" />
  <!-- ?v=N below is a cache-buster: without it, browsers can keep running an
       old cached copy of style.css/app.js after you've uploaded a new one,
       even on a normal reload. Bump this number by 1 every time you upload
       an update, on both lines below, so devices are guaranteed to fetch
       the new version instead of an old cached one. -->
  <link rel="stylesheet" href="style.css?v=1" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
</head>
<body>
  <div id="app">
    <header class="top-bar">
      <h1 id="home-link">📚 GCSE Revision</h1>
      <div class="header-right">
        <button class="a11y-toggle" id="dyslexia-toggle" type="button" title="Dyslexia-friendly display" aria-pressed="false">Aa</button>
        <div class="profile-pill" id="profile-pill">Choose profile</div>
      </div>
    </header>
    <main id="main">
      <div class="empty-state">Loading…</div>
    </main>
  </div>
  <script type="module" src="js/app.js?v=1"></script>
</body>
</html>
